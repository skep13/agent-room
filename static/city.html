<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI City Council</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101113;--panel:#17181b;--soft:#1f2024;--ink:#ecebe7;--muted:#8e8c87;--line:#26272b;--accent:#e9c46a;--pink:#e47aa6;--cyan:#6cc4d2;--ok:#8fcf7a;--bad:#ef6f6c;
  --sans:"Archivo",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,Menlo,monospace;--r:8px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:relative;flex:1 1 64%;min-height:240px;background:#0a0f14;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:2;align-items:flex-start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.glass{background:rgba(16,17,19,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.06);border-radius:10px}
.clock{font:700 15px/1 var(--sans);color:var(--ink);padding:7px 11px}
.tag{font:500 12px/1 var(--sans);padding:7px 10px;color:var(--muted)}
.tag.on{color:var(--ok)}
.tag.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.stats{display:flex;flex-wrap:wrap;padding:6px 4px}
.st{padding:2px 10px;min-width:58px;border-left:1px solid var(--line)}
.st:first-child{border-left:0}
.st small{display:block;font:500 10.5px/1.2 var(--sans);color:var(--muted)}
.st b{font:600 15px/1.25 var(--sans)}
.st b small{display:inline;font-size:11px;color:var(--muted)}
.st i{display:block;height:2px;background:var(--line);margin-top:3px;border-radius:2px}
.st i u{display:block;height:100%;background:var(--ok);border-radius:2px}
.st.warn b{color:var(--accent)}.st.warn i u{background:var(--accent)}
.st.bad b{color:var(--bad)}.st.bad i u{background:var(--bad)}
.alerts{display:flex;gap:6px;flex-wrap:wrap}
.al{font:600 12px/1.2 var(--sans);padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--bad) 85%,#000);color:#fff}
.al.fc{background:rgba(16,17,19,.85);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
#session{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 14px;z-index:2;max-width:calc(100% - 140px);text-align:center}
#session h4{margin:0;font:600 13px/1.2 var(--sans)}
#session .ms{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.chip{font:500 12px/1 var(--sans);padding:4px 8px;border-radius:999px;background:var(--soft);display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
.chip .d{width:7px;height:7px;border-radius:50%}
.chip.wait .d{animation:blink 1.2s ease-in-out infinite}
.chip.done{color:var(--ink)}
@keyframes blink{50%{opacity:.25}}
#paused{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,10,14,.45);pointer-events:none;z-index:1}
#paused div{font:600 17px/1.3 var(--sans);text-align:center;padding:14px 20px;max-width:80%}
#paused small{display:block;font:400 13px/1.4 var(--sans);color:var(--muted);margin-top:4px}
#ctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:3;padding:4px}
#ctl button{font:500 12px/1 var(--sans);padding:7px 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;text-align:left}
#ctl button:hover{background:var(--soft);color:var(--ink)}
#ctl button.on{color:var(--accent)}
#toasts{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:3;max-width:min(320px,55%)}
.toast{background:rgba(23,24,27,.95);color:var(--ink);font:500 13px/1.4 var(--sans);padding:8px 12px;border-radius:10px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.35);animation:tin .2s ease-out;transition:opacity .5s}
.toast.bad{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.toast.good{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
@keyframes tin{from{transform:translateY(-4px);opacity:0}}
#tip{position:absolute;pointer-events:none;font:500 12px var(--sans);background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:5px 9px;border-radius:6px;z-index:4;white-space:nowrap}
#panel{flex:0 0 36%;min-height:150px;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--bg)}
.tabs{display:flex;gap:4px;padding:8px 12px 0}
.tabs button{background:none;border:0;color:var(--muted);font:500 13px var(--sans);padding:7px 12px;cursor:pointer;border-radius:8px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--soft);color:var(--ink)}
.pane{flex:1;overflow-y:auto;padding:10px 16px}
.dec{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.dec .t{font:500 12px var(--sans);color:var(--muted)}
.dec code{font:600 13px var(--mono);color:var(--ink)}
.dec .r{grid-column:2/4;color:var(--muted);font-size:13px}
.v{font:500 11.5px var(--sans);padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.v.yes{color:var(--ok)}.v.no{color:var(--bad)}.v.np{color:var(--accent)}
.ev{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.ev .t{font:500 12px var(--sans);color:var(--muted);margin-right:8px;opacity:.7}
.ev.disaster{color:var(--bad)}.ev.recovered,.ev.disaster_over{color:var(--ok)}.ev.forecast{color:var(--accent)}.ev.said{color:var(--ink)}
.rep{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.btn{font:500 13px/1 var(--sans);padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block}
.btn:hover{background:var(--soft)}
.btn.sm{font-size:12px;padding:5px 9px}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.hint{color:var(--muted);font-size:13px}
.spark{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 10px}
.spark div{font:500 12px var(--sans);color:var(--muted)}
.spark svg{display:block;margin-top:3px}
h5{margin:14px 0 4px;font:600 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
body.tall #panel{display:none}
#reader{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:10;padding:12px}
#reader .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.45);width:min(820px,100%);max-height:92vh;display:flex;flex-direction:column}
#reader .top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#reader .body{overflow:auto;padding:4px 18px 16px;font-size:14px}
#reader table{border-collapse:collapse;font-size:13px;margin:8px 0;display:block;overflow-x:auto;max-width:100%}
#reader td,#reader th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
#reader th{color:var(--muted);font-weight:500}
#reader h1,#reader h2,#reader h3{font:700 17px/1.3 var(--sans);margin:18px 0 6px}
#reader code{font:600 12.5px var(--mono)}
@media (max-height:560px){#panel{flex:0 0 34%;min-height:110px}.pane{padding:6px 12px}}
@media (max-width:640px){.st{min-width:48px;padding:2px 7px}.st b{font-size:13px}#toasts{top:auto;bottom:60px}
  #session{left:12px;right:70px;transform:none;max-width:none}#session .ms{display:none}.tabs button{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="row"><span class="clock glass" id="clock">Day 1</span><span class="tag glass" id="state">Loading</span><span class="tag glass" id="runname"></span></div>
    <div class="stats glass" id="stats"></div>
    <div class="alerts" id="alerts"></div>
  </div>
  <div id="tip" hidden></div>
  <div id="paused" hidden><div class="glass">Council in recess<small id="why">The AIs are working on a project</small></div></div>
  <div id="session" class="glass" hidden></div>
  <div id="ctl" class="glass">
    <button id="v-grid" type="button" title="Show tile coordinates (the council uses x,y)">Grid</button>
    <button id="v-time" type="button" title="Preview day or night (only on your screen)">Live time</button>
    <button id="v-pop" type="button" title="Pop-ups for decisions and disasters">Pop-ups</button>
    <button id="v-home" type="button" title="Fit the whole city on screen">Fit</button>
  </div>
  <div id="toasts"></div>
</div>
<div id="panel">
  <div class="tabs"><button data-t="council" class="on" type="button">Council</button><button data-t="feed" type="button">Town hall</button><button data-t="rep" type="button">Runs &amp; reports</button></div>
  <div class="pane" id="p-council"></div>
  <div class="pane" id="p-feed" hidden></div>
  <div class="pane" id="p-rep" hidden>
    <p class="hint">A run is one city, from its founding until the next new run. Each run has a report (Markdown) and CSV data you can use in the research.</p>
    <button class="btn primary" id="export" type="button">Download this run's report</button>
    <div id="rep-list"></div>
  </div>
</div>
<div id="reader" hidden><div class="box">
  <div class="top"><b id="rd-title"></b><span><a class="btn sm" id="rd-dl" download>Download</a> <button class="btn sm" id="rd-close" type="button">Close</button></span></div>
  <div class="body" id="rd-body"></div></div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
if (Q.get("layout") === "tall") document.body.classList.add("tall");
const KEY = Q.get("key") || "";
const withKey = u => KEY ? u + (u.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY) : u;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
let city = null;
const VIEW = Object.assign({grid: false, time: "live", pops: true},
  (() => { try { return JSON.parse(localStorage.getItem("council-view")) || {}; } catch (e) { return {}; } })());
function saveView() { try { localStorage.setItem("council-view", JSON.stringify(VIEW)); } catch (e) {} paintCtl(); }
function paintCtl() {
  $("v-grid").classList.toggle("on", VIEW.grid); $("v-pop").classList.toggle("on", VIEW.pops);
  $("v-time").textContent = {live: "Live time", day: "Day", night: "Night"}[VIEW.time]; $("v-time").classList.toggle("on", VIEW.time !== "live");
}

// ================= geometry: 2:1 isometric; x runs to the lower right, y to the lower left
const TW = 64, TH = 32;
let N = 20, OX = 0, OY = 0, MW = 0, MH = 0;
const cv = $("cv"), g = cv.getContext("2d");
let dpr = 1, fit = {s: 1, x: 0, y: 0}, cam = {s: 1, x: 0, y: 0};
function setSize(n) { N = n; OX = N * TW / 2 + 40; OY = 110; MW = N * TW + 80; MH = N * TH + 150; }
setSize(20);
const P = (x, y, z = 0) => [OX + (x - y) * TW / 2, OY + (x + y) * TH / 2 - z];
function resize() {
  const r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const s = Math.min(cv.width / MW, cv.height / MH);
  fit = {s, x: (cv.width - MW * s) / 2, y: (cv.height - MH * s) / 2 + 24 * dpr};
  if (!cam.user) cam = {...fit};
}
addEventListener("resize", resize);
const hash = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const rnd = (seed, i = 0) => (hash(seed + ":" + i) % 10000) / 10000;
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = n >> 8 & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); gg = Math.round((t - gg) * p + gg); b = Math.round((t - b) * p + b);
  return "#" + ((1 << 24) + (r << 16) + (gg << 8) + b).toString(16).slice(1);
}
function poly(pts, fill, stroke, lw = .6) {
  g.beginPath(); pts.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
const tileQ = (x, y, z = 0, i = 0) => [P(x + i, y + i, z), P(x + 1 - i, y + i, z), P(x + 1 - i, y + 1 - i, z), P(x + i, y + 1 - i, z)];
const rect = (x, y, w, d, z) => [P(x, y, z), P(x + w, y, z), P(x + w, y + d, z), P(x, y + d, z)];
// a box: its top, the face towards the lower left (y+d) and the face towards the lower right (x+w)
function box(x, y, w, d, z, h, c, cl, cr) {
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], cl || shade(c, -.16));
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], cr || shade(c, -.32));
  poly(rect(x, y, w, d, z + h), c);
}
const faceL = (x, y, w, d, u0, u1, z0, z1) => [P(x + u0 * w, y + d, z0), P(x + u1 * w, y + d, z0), P(x + u1 * w, y + d, z1), P(x + u0 * w, y + d, z1)];
const faceR = (x, y, w, d, u0, u1, z0, z1) => [P(x + w, y + u0 * d, z0), P(x + w, y + u1 * d, z0), P(x + w, y + u1 * d, z1), P(x + w, y + u0 * d, z1)];
let lights = [];      // windows and lamps that glow at night, drawn after the dark
function windows(x, y, w, d, z, h, rows, cols, seed, glass = "#30506b") {
  const fh = h / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const u0 = (c + .22) / cols, u1 = (c + .78) / cols, z0 = z + r * fh + fh * .25, z1 = z + r * fh + fh * .8;
    for (const [f, k] of [[faceL, 0], [faceR, 1]]) {
      const q = f(x, y, w, d, u0, u1, z0, z1);
      poly(q, k ? shade(glass, -.2) : glass);
      if (rnd(seed, r * 31 + c * 7 + k) < .55) lights.push(q);
    }
  }
}
function gable(x, y, w, d, z, rh, roof, wall) {            // the ridge runs along x
  const ym = y + d / 2;
  poly([P(x, y, z), P(x + w, y, z), P(x + w, ym, z + rh), P(x, ym, z + rh)], shade(roof, .08));
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, ym, z + rh), P(x, ym, z + rh)], roof);
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, ym, z + rh)], shade(wall, -.3));
}
function cyl(cx, cy, r, z, h, c, top) {
  const [a, b] = P(cx, cy, z), rx = r * TW * .71, ry = r * TH * .71;
  const gr = g.createLinearGradient(a - rx, 0, a + rx, 0);
  gr.addColorStop(0, shade(c, -.1)); gr.addColorStop(.6, shade(c, -.28)); gr.addColorStop(1, shade(c, -.45));
  g.fillStyle = gr; g.beginPath(); g.moveTo(a - rx, b - h); g.lineTo(a - rx, b); g.ellipse(a, b, rx, ry, 0, Math.PI, 0, true); g.lineTo(a + rx, b - h); g.closePath(); g.fill();
  g.fillStyle = top || shade(c, .12); g.beginPath(); g.ellipse(a, b - h, rx, ry, 0, 0, Math.PI * 2); g.fill();
}
function tree(x, y, s, seed, tone) {
  const [a, b] = P(x, y), k = .8 + rnd(seed) * .45;
  g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(a + 2, b + 1, 7 * s * k, 3.5 * s * k, 0, 0, 7); g.fill();
  g.fillStyle = "#6b4a2e"; g.fillRect(a - 1, b - 8 * s, 2, 8 * s);
  const c = tone || ["#3f8a3c", "#4c9a44", "#357a3a"][hash(seed) % 3];
  g.fillStyle = shade(c, -.2); g.beginPath(); g.arc(a + 1.5 * s, b - 12 * s * k, 7 * s * k, 0, 7); g.fill();
  g.fillStyle = c; g.beginPath(); g.arc(a - .8 * s, b - 13.5 * s * k, 6 * s * k, 0, 7); g.fill();
  g.fillStyle = shade(c, .18); g.beginPath(); g.arc(a - 2.5 * s, b - 15.5 * s * k, 2.6 * s * k, 0, 7); g.fill();
}
function smoke(a, b, t, seed, n = 5, col = "rgba(90,90,95,") {
  for (let i = 0; i < n; i++) {
    const f = ((t / 2600 + i / n + rnd(seed, i)) % 1);
    g.fillStyle = col + (.5 * (1 - f)).toFixed(2) + ")";
    g.beginPath(); g.arc(a + Math.sin(f * 6 + i) * 4 + f * 10, b - f * 46, 3 + f * 9, 0, 7); g.fill();
  }
}
function flame(a, b, t, seed, s = 1) {
  for (let i = 0; i < 3; i++) {
    const w = (6 - i * 1.6) * s, h = (16 + Math.sin(t / 120 + i * 2 + rnd(seed) * 9) * 4 - i * 3) * s;
    g.fillStyle = ["#ff4b1f", "#ff9a1f", "#ffe36b"][i];
    g.beginPath(); g.moveTo(a - w, b); g.quadraticCurveTo(a - w * .7, b - h * .5, a + Math.sin(t / 90 + i) * 2, b - h); g.quadraticCurveTo(a + w * .7, b - h * .5, a + w, b); g.closePath(); g.fill();
  }
}

// ================= the buildings, one tile each
let B = new Map(), WATER = new Set();
const has = (x, y, t) => { const v = B.get(x + "," + y); return v && v.t === t && v.s !== "ruin"; };
function blackout() { return (city?.active || []).some(a => a.type === "gridfailure") || (city && city.stats.power_ratio < .5); }
const ART = {
  house(x, y, t, sd) {
    const roof = ["#b5462f", "#8f3b2b", "#3e5a74", "#5b4636"][sd % 4], wall = ["#efe6d3", "#e6d2b2", "#f3efe7", "#d9c3a5"][(sd >>> 3) % 4];
    box(x + .2, y + .22, .6, .56, 0, 15, wall);
    poly(faceL(x + .2, y + .22, .6, .56, .4, .6, 0, 9), "#6b4a2e");
    for (const u of [.12, .7]) { const q = faceL(x + .2, y + .22, .6, .56, u, u + .18, 6, 11); poly(q, "#38556e"); lights.push(q); }
    { const q = faceR(x + .2, y + .22, .6, .56, .3, .7, 6, 11); poly(q, "#2d4558"); lights.push(q); }
    gable(x + .16, y + .18, .68, .64, 15, 10, roof, wall);
    box(x + .6, y + .3, .08, .08, 19, 7, "#8a5a44");
  },
  flats(x, y, t, sd) {
    const c = ["#c9b8a2", "#a9b7bf", "#d8cfc0"][sd % 3];
    box(x + .12, y + .12, .76, .76, 0, 62, c);
    windows(x + .12, y + .12, .76, .76, 4, 56, 6, 3, "fl" + x + y);
    box(x + .14, y + .14, .72, .72, 62, 2.5, shade(c, -.25));
    box(x + .5, y + .25, .18, .2, 64.5, 6, "#8d9399");
    box(x + .25, y + .55, .12, .12, 64.5, 4, "#b8bec4");
  },
  farm(x, y, t, sd) {
    poly(tileQ(x, y, .5, .04), "#c9a55a");
    for (let i = 0; i < 6; i++) { const f = .08 + i * .15; poly([P(x + .05, y + f, 1), P(x + .95, y + f, 1), P(x + .95, y + f + .07, 1), P(x + .05, y + f + .07, 1)], i % 2 ? "#6f9c3a" : "#86b14a"); }
    box(x + .62, y + .08, .3, .3, 0, 11, "#a8362b");
    gable(x + .6, y + .06, .34, .34, 11, 7, "#e7e1d5", "#a8362b");
    cyl(x + .3, y + .2, .08, 0, 16, "#c8c3b4", "#7f7a72");
  },

  for (let s = 0; s < 2 * N - 1; s++) for (let x = Math.max(0, s - N + 1); x <= Math.min(s, N - 1); x++) {
    const y = s - x, k = x + "," + y, v = B.get(k);
    groundTile(x, y, T[y][x], t, dry);
    if (burnt.has(k) && T[y][x] !== "~") poly(tileQ(x, y, .2, .05), "rgba(40,32,28,.75)");
    if (v && v.t === "road") roadTile(x, y, v.s);

    const [cx, cy, r] = M.crater, [a, b] = P(cx + .5, cy + .5);
    g.fillStyle = "rgba(60,40,30,.6)"; g.beginPath(); g.ellipse(a, b, (r + 1.2) * TW * .55, (r + 1.2) * TH * .55, 0, 0, 7); g.fill();
    g.fillStyle = "#2a1d17"; g.beginPath(); g.ellipse(a, b, (r + .4) * TW * .5, (r + .4) * TH * .5, 0, 0, 7); g.fill();
    g.strokeStyle = "rgba(255,120,40," + (.4 + .3 * Math.sin(t / 400)).toFixed(2) + ")"; g.lineWidth = 2; g.stroke();
  }
  if (M.quake) {
    const [ex, ey, r] = M.quake; g.strokeStyle = "#2b2420"; g.lineWidth = 1.6;
    for (let i = 0; i < 7; i++) {
      const [a, b] = P(ex + .5, ey + .5); g.beginPath(); g.moveTo(a, b);
      const ang = i / 7 * Math.PI * 2 + rnd("q" + ex, i);
      for (let j = 1; j <= r * 2; j++) { const f = j / 2, [c, d] = P(ex + .5 + Math.cos(ang) * f + (rnd("qq", i * 9 + j) - .5) * .4, ey + .5 + Math.sin(ang) * f + (rnd("qr", i * 9 + j) - .5) * .4); g.lineTo(c, d); }
      g.stroke();

    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const v = B.get(x + "," + y); if (!v || v.t === "road") { const [a, b] = P(x + .5, y + .5); g.fillText(x + "," + y, a, b + 2.5); } }

  for (let s = 0; s < 2 * N - 1; s++) for (let x = Math.max(0, s - N + 1); x <= Math.min(s, N - 1); x++) {
    const y = s - x, k = x + "," + y, v = B.get(k), ch = T[y][x];

    else if (!v && ch === "." && hash(k) % 23 === 0) tree(x + .5, y + .5, .7, "s" + k, winter ? "#5d6b5a" : null);

  g.setTransform(cam.s, 0, 0, cam.s, cam.x, cam.y);
  const glow = (x, y, r, c) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); };

  const tint = c => { g.fillStyle = c; g.fillRect(0, 0, cv.width, cv.height); };
  if (act.includes("heatwave")) tint(`rgba(255,120,30,${(.12 + .04 * Math.sin(t / 700)).toFixed(3)})`);
  if (act.includes("drought")) tint("rgba(220,170,60,.08)");
  if (act.includes("outbreak")) tint(`rgba(90,200,60,${(.14 + .06 * Math.sin(t / 500)).toFixed(3)})`);
  else if (act.includes("pandemic")) tint("rgba(120,200,120,.08)");
  if (act.includes("meteor")) tint("rgba(110,80,60,.18)");
  const fall = winter ? "ash" : act.includes("flood") ? "rain" : null;
  if (fall) {
    if (fall === "ash") tint("rgba(150,150,160,.14)");
    while (falling.length < 160) falling.push({x: Math.random() * cv.width, y: Math.random() * cv.height, v: .5 + Math.random()});
    g.fillStyle = "rgba(225,225,230,.8)"; g.strokeStyle = "rgba(190,220,255,.5)"; g.lineWidth = 1;

      p.y += (fall === "ash" ? 30 : 420) * p.v * dt * dpr; p.x += (fall === "ash" ? Math.sin(t / 900 + p.v * 9) * 12 : -60) * dt * dpr;
      if (p.y > cv.height) { p.y = -5; p.x = Math.random() * cv.width; }
      if (fall === "ash") { g.beginPath(); g.arc(p.x, p.y, 1.4 * dpr * p.v, 0, 7); g.fill(); }
      else { g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - 3 * dpr, p.y + 10 * dpr); g.stroke(); }
    }
  } else falling = [];
  if (hover) { g.setTransform(cam.s, 0, 0, cam.s, cam.x, cam.y); poly(tileQ(hover[0], hover[1], .5), "rgba(255,214,10,.18)", "#ffd60a", 1.4); }
  requestAnimationFrame(frame);
}

// ================= HUD and panels
const fmt = n => Math.abs(n) >= 10000 ? (n / 1000).toFixed(1) + "k" : String(Math.round(n));
function statBox(label, val, frac, level) {

}
function renderHUD() {

  $("state").textContent = city.session ? "Council in session" : city.running ? "Meets between projects" : "Recess";
  $("state").classList.toggle("on", !!city.session);

    statBox("People", `${fmt(s.pop)}<small> /${fmt(s.homes)}</small>`, s.homes ? s.pop / s.homes : 0, lv(s.pop <= s.homes, true)),
    statBox("Happy", s.happy, s.happy / 100, lv(s.happy >= 55, s.happy >= 40)),
    statBox("Food", fmt(s.food), s.food / s.food_cap, lv(s.food_make >= s.food_need, s.food > 0)),
    statBox("Water", fmt(s.water), s.water / s.water_cap, lv(s.water_make >= s.water_need, s.water > 0)),
    statBox("Power", Math.round(s.power_ratio * 100) + "%", s.power_ratio, lv(s.power_ratio >= 1, s.power_ratio >= .7)),
    statBox("Sick", fmt(s.sick), Math.min(1, s.sick / Math.max(1, s.care)), lv(s.sick <= s.care, s.sick <= s.care * 1.5)),
    statBox("Died", fmt(s.deaths || 0), null, s.deaths ? "warn" : ""),

  $("alerts").innerHTML = (city.active || []).map(a => `<span class="al">${esc(a.name)} · severity ${a.severity} · ${a.left}d left</span>`).join("") +
    (city.forecast || []).map(f => `<span class="al fc">Forecast: ${esc(f.name)} in ${f.in}d · severity ${f.severity}</span>`).join("");
  $("paused").hidden = city.running || !city.paused;
  $("why").textContent = city.paused ? city.paused[0].toUpperCase() + city.paused.slice(1) : "";
  const ses = city.session, sb = $("session");

    const col = Object.fromEntries((city.members || []).map(m => [m.name, m.color]));
    sb.innerHTML = `<h4>Council in session · ${ses.phase === "propose" ? "proposals" : "the vote"}</h4><div class="ms">` +
      ses.members.map(n => `<span class="chip ${ses.waiting.includes(n) ? "wait" : "done"}"><span class="d" style="background:${esc(col[n] || "#888")}"></span>${esc(n)}</span>`).join("") + "</div>";
    sb.hidden = false;

}
function spark(vals, color, w = 150, h = 34) {
  if (vals.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * (w - 2) + 1).toFixed(1)},${(h - 2 - (v - lo) / r * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
}
function renderCouncil() {
  const h = city.history || [], s = city.stats, decs = city.decisions || [];
  const pol = (city.policies || []).length ? city.policies.map(p => `<span class="v yes">${esc(p)}</span>`).join(" ") : "none";
  $("p-council").innerHTML =
    `<div class="spark"><div>People ${s.pop}${spark(h.map(x => x.pop), "#1ee3ff")}</div><div>Money ${s.money}${spark(h.map(x => x.money), "#ffd60a")}</div><div>Happiness ${s.happy}${spark(h.map(x => x.happy), "#ff2d87")}</div></div>` +
    `<p class="hint">Tax ${city.tax}% · income ${s.income}/day · costs ${s.costs}/day · reserve ${s.reserve} · jobs ${s.jobs} for ${s.workers} workers · power ${s.power}/${s.power_need} · shelter for ${s.shelter} · pollution ${s.pollution}</p>` +
    `<p class="hint">Policies: ${pol}</p>` +
    `<p class="hint">Councillors: ${(city.members || []).map(m => `<b style="color:${esc(m.color)}">${esc(m.name)}</b>`).join(", ") || "none yet"}</p>` +
    `<h5>Decisions</h5>` +
    (decs.length ? decs.map(d => {
      const state = d.done ? ["yes", "done"] : d.passed ? ["np", "passed, not done"] : d.result ? ["no", "rejected"] : ["", "voting"];

      return `<div class="dec"><span class="t">D${d.day} #${d.n}</span><span><code>${esc(d.action)}</code> <span class="hint">by ${esc(d.author)}${d.cost ? " · costs " + d.cost : ""}</span></span>` +
        `<span class="v ${state[0]}">${state[1]} ${d.yes.length}-${d.no.length}</span>` + (note ? `<span class="r">${esc(note)}</span>` : "") + `</div>`;

}
function renderFeed() {

}
function toast(text, kind) {
  if (!VIEW.pops) return;
  const el = document.createElement("div"); el.className = "toast " + (kind || ""); el.textContent = text;
  $("toasts").prepend(el);
  while ($("toasts").children.length > 4) $("toasts").lastChild.remove();
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 600); }, kind === "bad" ? 9000 : 5500);

function apply(next) {

  city = next;
  B = new Map((city.buildings || []).map(b => [b.x + "," + b.y, b]));
  WATER = new Set(); city.terrain.forEach((row, y) => [...row].forEach((c, x) => { if (c === "~") WATER.add(x + "," + y); }));
  renderHUD(); renderCouncil(); renderFeed();
}
function onEvent(ev) {
  const k = ev.kind;
  if (k === "disaster") toast(ev.text, "bad");
  else if (k === "forecast") toast(ev.text, "");
  else if (k === "recovered" || k === "disaster_over" || k === "run") toast(ev.text, "good");
  else if (k === "decision" && ev.data && ev.data.done) toast(ev.text.replace(/^Done: /, "Council: "), "");

async function load() {
  const r = await fetch(withKey("/api/city"), {credentials: "same-origin"});
  if (r.status === 401 || r.status === 403) { $("state").textContent = "Sign in to the room to see the city"; return false; }
  const v = await r.json();
  if (v.council) apply(v); else $("state").textContent = "The city isn't running";
  return true;
}
function live() {
  const es = new EventSource(withKey("/api/stream"));
  es.addEventListener("city", e => { const v = JSON.parse(e.data); if (v.council) apply(v); });
  es.addEventListener("city_event", e => onEvent(JSON.parse(e.data)));
  es.onerror = () => { es.close(); setTimeout(live, 5000); };
}

async function reports() {

  const list = r.ok ? await r.json() : [];
  $("rep-list").innerHTML = list.map(x => `<div class="rep"><span>${esc(x.title)}${x.current ? ' <span class="v yes">now</span>' : ""}</span><span>` +
    `<button class="btn sm" type="button" data-read="${x.id}" data-title="${esc(x.title)}">Read</button> ` +
    `<a class="btn sm" href="${withKey(`/api/city/reports/${x.id}.md`)}" download>Report</a> ` +
    `<a class="btn sm" href="${withKey(`/api/city/runs/${x.id}/days.csv`)}" download>Days CSV</a> ` +
    `<a class="btn sm" href="${withKey(`/api/city/runs/${x.id}/decisions.csv`)}" download>Votes CSV</a></span></div>`).join("")
    || `<p class="hint">No runs yet.</p>`;
}
function md(src) {                          // just enough Markdown for the reports: headings, tables, lists
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const L = src.split("\n"), out = []; let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^#{1,6} /.test(l)) { const n = Math.min(3, l.match(/^#+/)[0].length); out.push(`<h${n}>${inline(l.replace(/^#+ /, ""))}</h${n}>`); i++; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\|[\s:|-]+\|$/.test(r));
      out.push("<table>" + body.map((r, k) => "<tr>" + cells(r).map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^\s*[-*] /.test(l)) { const it = []; while (i < L.length && /^\s*[-*] /.test(L[i])) it.push(L[i++].replace(/^\s*[-*] /, "")); out.push("<ul>" + it.map(x => `<li>${inline(x)}</li>`).join("") + "</ul>"); continue; }
    if (/^>/.test(l)) { out.push(`<blockquote>${inline(l.replace(/^>\s?/, ""))}</blockquote>`); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < L.length && L[i].trim() && !/^(#{1,6} |\||\s*[-*] |>)/.test(L[i])) para.push(L[i++]);
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return out.join("");
}
$("rep-list").onclick = async e => {

// ================= pointer: hover a tile, drag to pan, wheel to zoom
const NAMES = {"~": "Water", ".": "Grass", "T": "Forest", "^": "Hill"};
function tileAt(cx, cy) {
  const mx = (cx * dpr - cam.x) / cam.s - OX, my = (cy * dpr - cam.y) / cam.s - OY;
  const u = mx / (TW / 2), v = my / (TH / 2), x = Math.floor((u + v) / 2), y = Math.floor((v - u) / 2);
  return x >= 0 && y >= 0 && x < N && y < N ? [x, y] : null;
}
let drag = null;
cv.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointerup", () => { drag = null; });
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect();
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    if (drag.moved) { cam.x = drag.cx + dx * dpr; cam.y = drag.cy + dy * dpr; cam.user = true; $("tip").hidden = true; return; }
  }
  if (!city) return;
  hover = tileAt(e.clientX - r.left, e.clientY - r.top);
  const tip = $("tip");
  if (!hover) { tip.hidden = true; return; }
  const [x, y] = hover, v = B.get(x + "," + y), cat = city.catalogue || {};
  tip.textContent = `${x},${y} · ` + (v ? (cat[v.t]?.name || v.t) + (v.s === "ok" ? "" : v.s === "ruin" ? " (ruin)" : " (damaged)") : NAMES[city.terrain[y][x]] || "");
  tip.style.left = Math.max(0, Math.min(r.width - 170, e.clientX - r.left + 14)) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px"; tip.hidden = false;
});
cv.addEventListener("pointerleave", () => { hover = null; $("tip").hidden = true; });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * dpr, py = (e.clientY - r.top) * dpr;
  const ns = Math.max(fit.s * .7, Math.min(fit.s * 5, cam.s * Math.exp(-e.deltaY * .0015))), f = ns / cam.s;
  cam.x = px - (px - cam.x) * f; cam.y = py - (py - cam.y) * f; cam.s = ns; cam.user = true;
}, {passive: false});
cv.addEventListener("dblclick", () => { cam = {...fit}; });
$("v-home").onclick = () => { cam = {...fit}; };
