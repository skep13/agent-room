name: Agent Room desktop app

# Builds the agent-room desktop app for Windows, macOS and Linux.
# Run it by hand (Actions → Agent Room desktop app → Run workflow), or push a
# tag like v0.3.0 to publish the installers as a release (marked latest).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

env:
  AGENT_ROOM_DEFAULT_HUB: https://roomofais.xyz

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles msi,nsis
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux build packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        env:   # signs the update files so installed apps can trust them
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          # Plain, predictable names so download links are easy to write.
          v=$(node -p "require('./package.json').version")
          out=../dist-out; mkdir -p $out
          b=src-tauri/target
          put() { f=$(find $b -path '*/release/bundle/*' -type f -name "$1" | head -1); [ -n "$f" ] && cp "$f" "$out/$2"; true; }
          put '*-setup.exe'  "AgentRoom-$v-windows-setup.exe"
          put '*.msi'        "AgentRoom-$v-windows.msi"
          put '*.deb'        "AgentRoom-$v-linux-amd64.deb"
          put '*.rpm'        "AgentRoom-$v-linux-x86_64.rpm"
          put '*.AppImage'   "AgentRoom-$v-linux-x86_64.AppImage"
          put '*.dmg'        "AgentRoom-$v-macos.dmg"
          # what the in-app updater downloads, and their signatures
          put '*.app.tar.gz'      "AgentRoom-$v-macos.app.tar.gz"
          put '*.app.tar.gz.sig'  "AgentRoom-$v-macos.app.tar.gz.sig"
          put '*-setup.exe.sig'   "AgentRoom-$v-windows-setup.exe.sig"
          put '*.AppImage.sig'    "AgentRoom-$v-linux-x86_64.AppImage.sig"
          ls -l $out
          [ -n "$(ls $out)" ]

      - uses: actions/upload-artifact@v4
        with:
          name: agent-room-${{ matrix.name }}
          path: dist-out/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"; v="${tag#v}"
          sed "s/{v}/$v/g" release-notes.md > ../notes.md
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --latest --title "Agent Room $v" --notes-file ../notes.md || true
          gh release upload "$tag" ../dist-out/* --clobber

  # latest.json tells installed apps there's a new version and where to get it.
  updates:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"; v="${tag#v}"
          base="https://github.com/${GH_REPO}/releases/download/$tag"
          python3 - "$v" "$base" <<'PY'
          import json, sys, datetime, os
          v, base = sys.argv[1], sys.argv[2]
          def entry(name):
              sig = f"art/{name}.sig"
              return {"signature": open(sig).read().strip(), "url": f"{base}/{name}"} if os.path.exists(sig) else None
          plat = {}
          mac = entry(f"AgentRoom-{v}-macos.app.tar.gz")
          if mac: plat["darwin-aarch64"] = plat["darwin-x86_64"] = mac
          win = entry(f"AgentRoom-{v}-windows-setup.exe")
          if win: plat["windows-x86_64"] = win
          lin = entry(f"AgentRoom-{v}-linux-x86_64.AppImage")
          if lin: plat["linux-x86_64"] = lin
          json.dump({"version": v, "notes": f"Room of AIs {v}",
                     "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "platforms": plat}, open("latest.json", "w"), indent=2)
          print(open("latest.json").read())
          PY
          gh release upload "$tag" latest.json --clobber
